<!doctype html>

<html lang="nl">
    <head>
        <meta charset="utf-8">

        <title>Sogyo Adventure</title>
        <meta name="description" content="The ticket shop for Sogyo employees">
        <link rel="icon" type="image/x-icon" href="client/img/favicon.ico">
        <link rel="stylesheet" href="style/main.css">
        <script src="src/myorders.js"></script>
    </head>

    <body>

        <header class="topbar";>
            <div id="mainheader" style="padding-top:0.3em; padding-bottom:0.3em;">
                <img src="img/logo_sogyo_rgb_199x200-1.jpg" style="height:1.2em; position:absolute; left:0.5em;">
                Sogyo Adventure
            </div>
            <nav>
                <a id="home" href="index.html">
                    Home
                </a>
                |
                <a id="map" href="map.html">
                    Discover
                </a>
                |
                <a id="shoppingbasket" href="shoppingbasket.html">
                    Shopping basket <div class="badge"></div>
                </a>
                |
                <a id="myorders" href="orders.html">
                    My orders
                </a>
                |
                <a id="admin" href="admin.html">
                    Admin
                </a>
            </nav>
        </header>

        <main class="articles">
            <template id="completedOrders">
                <div>
                    <div class="parkname"></div>
                    <div>——— Tickets ordered ———</div>
                    <div>Adults: <span class="adultTicket"></span> Children: <span class="childTicket"></span></div>
                    <div>Total price: <span class="sign">&euro;</span> <span class="price"></span><span class="zerocents"></span></div>
                    <div class="ordertime">Order placed: <span class="date"></span> at <span class="time"></span></div>
                    <div class="deliverytype">Delivery type: <span class="type">Electronic mail</span></div>
                    <div class="address">At: <span class="address">ClientName@ExampleMail.org</span></div>
                </div>
            </template>
        </main>
    </body>
</html>
