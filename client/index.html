<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<html lang="nl">
    <head>
        <meta charset="utf-8">
        <title>Sogyo Adventure</title>
        <meta name="description" content="The ticket shop for Sogyo employees">
        <link rel="stylesheet" href="style/main.css">
        <link rel="icon" type="image/x-icon" href="client/img/favicon.ico">
        <script src="src/index.js"></script>
    </head>
    <body>
        <header class="topbar";>
            <div id="mainheader" style="padding-top:0.3em; padding-bottom:0.3em;">
                <img src="img/logo_sogyo_rgb_199x200-1.jpg" style="height:1.2em; position:absolute; left:0.5em;">
                Sogyo Adventure
            </div>
            <nav>
                <a id="home" href="index.html">
                    Home
                </a>
                |
                <a id="map" href="map.html">
                    Discover
                </a>
                |
                <a id="shoppingbasket" href="shoppingbasket.html">
                    Shopping basket <div class="badge"></div>
                </a>
                |
                <a id="myorders" href="orders.html">
                    My orders
                </a>
                |
                <a id="admin" href="admin.html">
                    Admin
                </a>
            </nav>
        </header>
        <main class="articles">
            <template id="attraction">
                <div>
                <div class="parkname">parkname</div>
                <div class="parkdescription">
                    parkdescription
                </div>
                    <div class="order">
                        <div>
                            <div class="prices">
                                <div class="adultprice">Adults: <span class="sign">&euro;</span><span class="price"></span></div>
                                <div class="kidsprice">Kids: <span class="sign">&euro;</span><span class="price"></span></div>
                                <div class="discountrequirement">
                                    <em>Family ticket:</em>
                                    Buy <span class="adults"></span> adult tickets & <span class="child"></span> kid tickets for a <span class="percentage"></span>% discount!
                                </div>
                                <div class="ticketsAvailable">
                                    Tickets available: <span class="number"></span>
                                </div>
                            </div>
                            <label>Adults: </label><input placeholder="adults" type="number" class="numberofadults" />
                            <label>Kids: </label><input placeholder="kids" type="number" class="numberofkids" />
                            <div class="total"><span class="sign">&euro;</span><span class="price">0,-</span></div>
                        </div>
                        <button class="orderbutton" onclick="orderButtonClicked(event)">
                            <img src="https://cdn-icons-png.flaticon.com/512/3144/3144456.png" style="height:100%; width:100%"/>
                        </button>
                    </div>
                </div>
            </template>

        </main>
    </body>
</html>
