<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<html lang="nl">
    <head>
        <meta charset="utf-8">
        <title>Sogyo Adventure</title>
        <meta name="description" content="The ticket shop for Sogyo employees">
        <link rel="stylesheet" href="style/main.css">
        <link rel="icon" type="image/x-icon" href="client/img/favicon.ico">
        <script src="src/index.js"></script>
    </head>
    <body>
        <header class="topbar";>
            <div id="mainheader" style="padding-top:0.3em; padding-bottom:0.3em;">
                <img src="img/logo_sogyo_rgb_199x200-1.jpg" style="height:1.2em; position:absolute; left:0.5em;">
                Sogyo Adventure
            </div>
            <nav>
                <a id="home" href="index.html" title="Returns the current page.">
                    Home
                </a>
                |
                <a id="map" href="map.html" title="Discover the location of our amusement parks.">
                    Discover
                </a>
                |
                <a id="shoppingbasket" href="shoppingbasket.html" title="Check out your shopping cart.">
                    Shopping basket <div class="badge"></div>
                </a>
                |
                <a id="myorders" href="orders.html" title="Check out your placed orders.">
                    My orders
                </a>
                |
                <a id="admin" href="admin.html" title="For administrators only.">
                    Admin
                </a>
            </nav>
        </header>
        <main class="articles">
            <template id="attraction">
                <div>
                    <div class="parkname" title="Name of amusement park."></div>
                    <div class="parkdescription" title="Description of amusement park."></div>
                    <div class="order">
                        <div>
                            <div class="prices">
                                <div class="adultprice" title="Price of ticket for an adult.">Adults: <span class="sign">&euro;</span><span class="price"></span></div>
                                <div class="kidsprice" title="Price of ticket for a child of less than 13 years old.">Kids (&lt;13 years): <span class="sign">&euro;</span><span class="price"></span></div>
                                <div class="discountrequirement" title="Sets of tickets that are discounted.">
                                    <em>Family ticket:</em>
                                    Buy <span class="adults"></span> adult tickets & <span class="child"></span> kid tickets for a <span class="percentage"></span>% discount!
                                </div>
                                <div class="ticketsAvailable" title="Tickets currently in stock.">
                                    Tickets available: <span class="number"></span>
                                </div>
                            </div>
                            <label>Adults: </label><input placeholder="adults" type="number" class="numberofadults" title="Please select number of adult tickets."/>
                            <label>Kids: </label><input placeholder="kids" type="number" class="numberofkids" title="Please select number of child tickets."/>
                            <div class="total"><span class="sign">&euro;</span><span class="price">0,-</span></div>
                            <div><span class="discountAmount" title="Total applied discount."></span></div>
                        </div>
                        <button class="orderbutton" onclick="orderButtonClicked(event)" title="Click here to add your order to cart.">
                            <img src="https://cdn-icons-png.flaticon.com/512/3144/3144456.png" style="height:100%; width:100%"/>
                        </button>
                    </div>
                </div>
            </template>
        </main>
    </body>
</html>
