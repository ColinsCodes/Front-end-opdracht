<!doctype html>

<html lang="nl">
    <head>
        <meta charset="utf-8">

        <title>Sogyo Adventure</title>
        <meta name="description" content="The ticket shop for Sogyo employees">
        <link rel="icon" type="image/x-icon" href="client/img/favicon.ico">
        <link rel="stylesheet" href="style/main.css">
        <script src="src/shoppingbasket.js"></script>
    </head>

    <body>

        <header class="topbar";>
            <div id="mainheader" style="padding-top:0.3em; padding-bottom:0.3em;">
                <img src="img/logo_sogyo_rgb_199x200-1.jpg" style="height:1.2em; position:absolute; left:0.5em;">
                Sogyo Adventure
            </div>
            <nav>
                <a id="home" href="index.html">
                    Home
                </a>
                |
                <a id="map" href="map.html">
                    Discover
                </a>
                |
                <a id="shoppingbasket" href="shoppingbasket.html">
                    Shopping basket <div class="badge"></div>
                </a>
                |
                <a id="myorders" href="orders.html">
                    My orders
                </a>
                |
                <a id="admin" href="admin.html">
                    Admin
                </a>
            </nav>
        </header>

        <main class="orderlist">
            <section id="orderCartContents">
            </section>
            <div id="orderTotal">Total: <span class="sign">&euro;</span> <span id="totalSum">0,-</span></div>
            <button id="finalizepaymentbutton" onclick="payButtonClicked()"></link>Pay now</button>
            <button id="clearCart" onclick="clearCartButtonClicked()">Clear cart</button>
        </main>

        <template id="ticket">
            <article>
                <div>Parkname</div>
                <div>Adults: </div>
                <div>Kids:</div>
                <button>Cancel order</button>
            </article>
        </template>

    </body>
</html>
